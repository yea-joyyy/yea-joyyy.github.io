<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>yea-joyyy 的个人网站</title>

  <style>
    body {
      font-family: Arial, "黑体", sans-serif;
      background-color: #e0f2f1;
      color: #333;
      padding-top: 90px;
      margin: 0;
    }

    /* ── 导航栏 ── */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      background: rgba(250, 248, 245, 0.75);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid rgba(220, 210, 195, 0.5);
      box-shadow: 0 2px 16px rgba(180, 160, 130, 0.12);
    }

    .navbar-inner {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: rgba(255, 252, 248, 0.5);
      border: 1px solid rgba(220, 210, 195, 0.45);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .navbar a {
      position: relative;
      z-index: 1;
      padding: 7px 20px;
      border-radius: 999px;
      color: #5a5248;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.25s ease;
    }

    .navbar a:hover,
    .navbar a.active {
      color: #2e2a26;
    }

    /* 液态玻璃滑动胶囊 */
    .glass-pill {
      position: absolute;
      top: 6px;
      left: 6px;
      height: calc(100% - 12px);
      border-radius: 999px;
      background: rgba(255, 252, 248, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(220, 210, 195, 0.7);
      box-shadow:
        0 2px 8px rgba(180, 160, 130, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    /* ── 主内容卡片 ── */
    .container {
      display: flex;
      align-items: center;
      gap: 30px;
      width: 90%;
      max-width: 700px;
      margin: 0 auto;
      padding: 40px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .text-column {
      text-align: left;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    a {
      color: #0077cc;
      text-decoration: none;
    }

    a:hover {
      color: #004499;
    }

    /* 导航栏链接不用全局 a 颜色 */
    .navbar a,
    .navbar a:hover {
      color: inherit;
    }
  </style>

</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="glass-pill" id="glassPill"></div>
      <a href="index.html" class="active" data-nav>Home</a>
      <a href="#projects" data-nav>Projects</a>
      <a href="hobbies.html" data-nav>Hobbies</a>
      <a href="travel.html" data-nav>Travel</a>
      <a href="blog.html" data-nav>Blog</a>
    </div>
  </nav>

  <div class="container">
    
    <div class="avatar-column">
      <img src="images/avatar.jpg" alt="我的头像" class="avatar">
    </div>

    <div class="text-column">
      
      <h1>This is my first website!</h1>
      <p>My name is yea！</p>
      <p>Email: <a href="mailto:yeawen3@gmail.com">yeawen3@gmail.com</a></p>

      <h2>Hi!</h2>

    </div>
  </div>

  <script>
    const pill = document.getElementById('glassPill');
    const links = document.querySelectorAll('[data-nav]');
    const inner = document.querySelector('.navbar-inner');

    function movePill(el) {
      const innerRect = inner.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      pill.style.left = (elRect.left - innerRect.left) + 'px';
      pill.style.width = elRect.width + 'px';
    }

    // 初始化：定位到 active 项
    const activeLink = document.querySelector('[data-nav].active');
    if (activeLink) {
      // 等待渲染完成再定位
      requestAnimationFrame(() => {
        pill.style.transition = 'none';
        movePill(activeLink);
        requestAnimationFrame(() => {
          pill.style.transition = '';
        });
      });
    }

    links.forEach(link => {
      link.addEventListener('mouseenter', () => movePill(link));
      link.addEventListener('click', () => {
        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // 鼠标离开导航栏时，胶囊回到 active 项
    inner.addEventListener('mouseleave', () => {
      const current = document.querySelector('[data-nav].active');
      if (current) movePill(current);
    });
  </script>

</body>
</html>
