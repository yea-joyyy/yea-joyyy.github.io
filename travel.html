<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel — yea-joyyy</title>
  <meta name="description" content="Places I've been, stories I've collected.">

  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Arial, "黑体", sans-serif;
      background-color: #e8f5f3;
      color: #333;
      margin: 0;
      padding-top: 60px;
      min-height: 100vh;
    }

    /* ── Navbar (identical to other pages) ── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      background: rgba(250, 248, 245, 0.75);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid rgba(220, 210, 195, 0.5);
      box-shadow: 0 2px 16px rgba(180, 160, 130, 0.12);
    }
    .navbar-inner {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: rgba(255, 252, 248, 0.5);
      border: 1px solid rgba(220, 210, 195, 0.45);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .navbar a {
      position: relative;
      z-index: 1;
      padding: 7px 20px;
      border-radius: 999px;
      color: #5a5248;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.25s ease;
    }
    .navbar a:hover, .navbar a.active { color: #2e2a26; }
    .glass-pill {
      position: absolute;
      top: 6px; left: 6px;
      height: calc(100% - 12px);
      border-radius: 999px;
      background: rgba(255, 252, 248, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(220, 210, 195, 0.7);
      box-shadow: 0 2px 8px rgba(180,160,130,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: left 0.35s cubic-bezier(0.34,1.56,0.64,1),
                  width 0.35s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
    }

    /* ── Map hero ── */
    .map-section {
      position: relative;
      width: 100%;
      height: 420px;
      background: #cfe9e5;
    }
    #travelMap {
      width: 100%;
      height: 100%;
    }
    .map-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(to bottom, transparent, #e8f5f3);
      pointer-events: none;
      z-index: 400;
    }
    .map-label {
      position: absolute;
      top: 20px; left: 28px;
      z-index: 400;
      background: rgba(255,252,248,0.88);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(220,210,195,0.6);
      border-radius: 12px;
      padding: 10px 16px;
      pointer-events: none;
    }
    .map-label h2 {
      margin: 0 0 2px;
      font-size: 15px;
      font-weight: 700;
      color: #2e2a26;
    }
    .map-label p {
      margin: 0;
      font-size: 12px;
      color: #8a8078;
    }

    /* Leaflet marker overrides */
    .custom-marker {
      width: 14px;
      height: 14px;
      background: #3d7a6e;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .custom-marker:hover { transform: scale(1.4); }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    .leaflet-popup-tip { background: #fff; }
    .map-popup-title { font-weight: 700; color: #2e2a26; margin-bottom: 2px; }
    .map-popup-date  { color: #8a8078; font-size: 11px; }
    .map-popup-link  {
      display: inline-block;
      margin-top: 6px;
      color: #3d7a6e;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    /* ── Timeline ── */
    .timeline-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }
    .timeline-header {
      margin-bottom: 48px;
    }
    .timeline-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #2e2a26;
      margin: 0 0 6px;
    }
    .timeline-header p {
      color: #7a7068;
      font-size: 15px;
      margin: 0;
    }

    .timeline {
      position: relative;
    }
    /* center spine */
    .timeline::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      background: linear-gradient(to bottom, #80cbc4, rgba(128,203,196,0.1));
      border-radius: 2px;
    }

    .timeline-item {
      display: flex;
      justify-content: flex-end;
      padding-right: calc(50% + 36px);
      margin-bottom: 64px;
      position: relative;
    }
    .timeline-item:nth-child(even) {
      justify-content: flex-start;
      padding-right: 0;
      padding-left: calc(50% + 36px);
    }

    /* dot on spine */
    .timeline-item::after {
      content: '';
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #3d7a6e;
      border: 3px solid #e8f5f3;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(61,122,110,0.25);
      z-index: 1;
    }

    /* year badge */
    .timeline-year {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      margin-top: -32px;
      background: #3d7a6e;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    .trip-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid rgba(220,210,195,0.35);
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .trip-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.13);
    }

    .trip-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .trip-card:hover .trip-card-img { transform: scale(1.04); }
    .trip-card-img-wrap { overflow: hidden; }

    .trip-card-body { padding: 20px 22px 22px; }
    .trip-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }
    .tag {
      background: #e0f2f1;
      color: #3d7a6e;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .trip-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2e2a26;
      margin: 0 0 6px;
    }
    .trip-card-excerpt {
      font-size: 13px;
      color: #6b6258;
      line-height: 1.55;
      margin: 0 0 12px;
    }
    .trip-card-meta {
      font-size: 12px;
      color: #a09890;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .trip-card-read {
      font-size: 12px;
      color: #3d7a6e;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: gap 0.2s;
    }
    .trip-card:hover .trip-card-read { gap: 6px; }
    .trip-card-read::after { content: "→"; }

    /* ── Modal (same pattern as blog) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 600;
      background: rgba(40,36,30,0.45);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal-sheet {
      background: #fffcf8;
      width: 100%;
      max-width: 800px;
      max-height: 92vh;
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      padding-bottom: 60px;
      transform: translateY(40px);
      transition: transform 0.35s cubic-bezier(0.34,1.2,0.64,1);
      box-shadow: 0 -8px 48px rgba(0,0,0,0.18);
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }

    .modal-handle { display: flex; justify-content: center; padding: 14px 0 8px; }
    .modal-handle span {
      width: 40px; height: 4px;
      background: rgba(160,150,140,0.35);
      border-radius: 999px;
    }

    .modal-cover {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .modal-header {
      padding: 20px 32px 18px;
      border-bottom: 1px solid rgba(220,210,195,0.5);
    }
    .modal-header-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .modal-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2e2a26;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    .modal-meta { font-size: 13px; color: #a09890; }

    /* photo gallery */
    .modal-gallery {
      display: flex;
      gap: 10px;
      padding: 20px 32px 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .modal-gallery::-webkit-scrollbar { height: 4px; }
    .modal-gallery::-webkit-scrollbar-thumb { background: rgba(180,160,130,0.4); border-radius: 2px; }
    .modal-gallery img {
      height: 150px;
      width: auto;
      flex-shrink: 0;
      border-radius: 12px;
      object-fit: cover;
      scroll-snap-align: start;
      transition: transform 0.2s;
    }
    .modal-gallery img:hover { transform: scale(1.03); }

    .modal-body {
      padding: 24px 32px 0;
      line-height: 1.78;
      color: #3d3530;
      font-size: 15px;
    }
    .modal-body h1,.modal-body h2,.modal-body h3 { color:#2e2a26; margin-top:1.5em; margin-bottom:0.4em; }
    .modal-body h1 { font-size:1.35rem; }
    .modal-body h2 { font-size:1.15rem; }
    .modal-body p { margin:0 0 1em; }
    .modal-body ul,.modal-body ol { padding-left:1.5em; margin:0 0 1em; }
    .modal-body li { margin-bottom:0.3em; }
    .modal-body blockquote {
      margin:1em 0; padding:12px 20px;
      background:#f0faf8; border-left:4px solid #80cbc4;
      border-radius:0 8px 8px 0; color:#5a6e6b; font-style:italic;
    }
    .modal-body code { background:#f4f2ee; padding:2px 6px; border-radius:4px; font-family:monospace; font-size:0.9em; }
    .modal-body pre { background:#2e2a26; color:#e8e0d8; padding:16px 20px; border-radius:10px; overflow-x:auto; font-size:0.88em; }
    .modal-body pre code { background:none; padding:0; color:inherit; }
    .modal-body strong { color:#2e2a26; }
    .modal-body a { color:#3d7a6e; }

    .modal-close {
      position: sticky;
      top: 16px;
      float: right;
      margin: 16px 24px 0 0;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(220,210,195,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #5a5248;
      transition: background 0.2s;
      z-index: 10;
    }
    .modal-close:hover { background: rgba(200,185,170,0.7); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .map-section { height: 280px; }
      .timeline::before { left: 20px; }
      .timeline-item,
      .timeline-item:nth-child(even) {
        justify-content: flex-start;
        padding-left: 52px;
        padding-right: 0;
      }
      .timeline-item::after { left: 20px; }
      .timeline-year { left: 20px; transform: translateX(-50%); }
      .trip-card { max-width: 100%; }
      .modal-cover { height: 180px; }
      .modal-header, .modal-body, .modal-gallery { padding-left: 20px; padding-right: 20px; }
      .modal-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="glass-pill" id="glassPill"></div>
      <a href="index.html" data-nav>Home</a>
      <a href="#projects" data-nav>Projects</a>
      <a href="#hobbies" data-nav>Hobbies</a>
      <a href="travel.html" class="active" data-nav>Travel</a>
      <a href="blog.html" data-nav>Blog</a>
    </div>
  </nav>

  <!-- Map hero -->
  <div class="map-section">
    <div id="travelMap"></div>
    <div class="map-overlay"></div>
    <div class="map-label">
      <h2>Places I've been</h2>
      <p id="mapSubtitle">Loading…</p>
    </div>
  </div>

  <!-- Timeline -->
  <div class="timeline-section">
    <div class="timeline-header">
      <h1>Travel Stories</h1>
      <p>Every trip, a chapter.</p>
    </div>
    <div class="timeline" id="timeline">
      <p style="color:#a09890;">Loading…</p>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-handle"><span></span></div>
      <img class="modal-cover" id="modalCover" src="" alt="">
      <div class="modal-header">
        <div class="modal-header-tags" id="modalTags"></div>
        <h1 class="modal-title" id="modalTitle"></h1>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
      <div class="modal-gallery" id="modalGallery"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    /* ── Navbar pill ── */
    const pill  = document.getElementById('glassPill');
    const links = document.querySelectorAll('[data-nav]');
    const inner = document.querySelector('.navbar-inner');

    function movePill(el) {
      const iR = inner.getBoundingClientRect();
      const eR = el.getBoundingClientRect();
      pill.style.left  = (eR.left - iR.left) + 'px';
      pill.style.width = eR.width + 'px';
    }
    const activeLink = document.querySelector('[data-nav].active');
    if (activeLink) {
      requestAnimationFrame(() => {
        pill.style.transition = 'none';
        movePill(activeLink);
        requestAnimationFrame(() => { pill.style.transition = ''; });
      });
    }
    links.forEach(link => {
      link.addEventListener('mouseenter', () => movePill(link));
      link.addEventListener('click', () => {
        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
    inner.addEventListener('mouseleave', () => {
      const cur = document.querySelector('[data-nav].active');
      if (cur) movePill(cur);
    });

    /* ── Helpers ── */
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'long' });
    }
    function tagsHtml(tags) {
      return tags.map(t => `<span class="tag">${t}</span>`).join('');
    }

    /* ── Map ── */
    const map = L.map('travelMap', {
      zoomControl: false,
      scrollWheelZoom: false,
      attributionControl: false
    }).setView([25, 15], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.attribution({ position: 'bottomright', prefix: '© OpenStreetMap © CARTO' }).addTo(map);

    function addMapMarker(trip) {
      const icon = L.divIcon({
        className: '',
        html: '<div class="custom-marker"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      const marker = L.marker([trip.lat, trip.lng], { icon }).addTo(map);
      marker.bindPopup(`
        <div class="map-popup-title">${trip.title}</div>
        <div class="map-popup-date">${formatDate(trip.date)}</div>
        <a class="map-popup-link" data-trip="${trip.id}">Read the story →</a>
      `);
      marker.on('click', () => {
        marker.openPopup();
      });
      return marker;
    }

    /* ── Timeline ── */
    function renderTimeline(trips) {
      const tl = document.getElementById('timeline');
      document.getElementById('mapSubtitle').textContent =
        `${trips.length} ${trips.length === 1 ? 'destination' : 'destinations'}`;

      let lastYear = null;
      tl.innerHTML = trips.map((trip, i) => {
        const year = new Date(trip.date).getFullYear();
        const yearBadge = year !== lastYear
          ? `<div class="timeline-year">${year}</div>` : '';
        lastYear = year;

        return `
          <div class="timeline-item" data-id="${trip.id}">
            ${yearBadge}
            <div class="trip-card" role="button" tabindex="0" aria-label="Read: ${trip.title}">
              <div class="trip-card-img-wrap">
                <img class="trip-card-img" src="${trip.coverImage}" alt="${trip.title}" loading="lazy">
              </div>
              <div class="trip-card-body">
                <div class="trip-card-tags">${tagsHtml(trip.tags)}</div>
                <h2 class="trip-card-title">${trip.title}</h2>
                <p class="trip-card-excerpt">${trip.excerpt}</p>
                <div class="trip-card-meta">
                  <span>${formatDate(trip.date)}</span>
                  <span class="trip-card-read">Read</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      tl.querySelectorAll('.trip-card').forEach(card => {
        const id = card.closest('.timeline-item').dataset.id;
        const open = () => openModal(trips.find(t => t.id === id));
        card.addEventListener('click', open);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
      });
    }

    /* ── Modal ── */
    const overlay = document.getElementById('modalOverlay');
    const sheet   = document.getElementById('modalSheet');

    function openModal(trip) {
      document.getElementById('modalCover').src = trip.coverImage;
      document.getElementById('modalCover').alt = trip.title;
      document.getElementById('modalTitle').textContent = trip.title;
      document.getElementById('modalTags').innerHTML = tagsHtml(trip.tags);
      document.getElementById('modalMeta').textContent = formatDate(trip.date) + ' · ' + trip.city + ', ' + trip.country;
      document.getElementById('modalBody').innerHTML = marked.parse(trip.content);
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = (trip.photos || [])
        .map(url => `<img src="${url}" alt="${trip.title}" loading="lazy">`)
        .join('');
      sheet.scrollTop = 0;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* popup "Read story" link → open modal */
    document.addEventListener('click', e => {
      const a = e.target.closest('[data-trip]');
      if (a && window._travels) {
        const trip = window._travels.find(t => t.id === a.dataset.trip);
        if (trip) { map.closePopup(); openModal(trip); }
      }
    });

    /* ── Load data ── */
    fetch('travels.json')
      .then(r => r.json())
      .then(trips => {
        window._travels = trips;
        trips.forEach(addMapMarker);
        renderTimeline(trips);
      })
      .catch(() => {
        document.getElementById('timeline').innerHTML =
          '<p style="color:#c0392b;">Could not load travel data.</p>';
      });
  </script>

</body>
</html>
