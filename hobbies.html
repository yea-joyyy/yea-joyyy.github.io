<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobbies — yea-joyyy</title>
  <meta name="description" content="Things I love doing.">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Arial, "黑体", sans-serif;
      background-color: #e0f2f1;
      color: #333;
      margin: 0;
      padding-top: 90px;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      background: rgba(250,248,245,0.75);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid rgba(220,210,195,0.5);
      box-shadow: 0 2px 16px rgba(180,160,130,0.12);
    }
    .navbar-inner {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: rgba(255,252,248,0.5);
      border: 1px solid rgba(220,210,195,0.45);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .navbar a {
      position: relative;
      z-index: 1;
      padding: 7px 20px;
      border-radius: 999px;
      color: #5a5248;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.25s ease;
    }
    .navbar a:hover, .navbar a.active { color: #2e2a26; }
    .glass-pill {
      position: absolute;
      top: 6px; left: 6px;
      height: calc(100% - 12px);
      border-radius: 999px;
      background: rgba(255,252,248,0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(220,210,195,0.7);
      box-shadow: 0 2px 8px rgba(180,160,130,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: left 0.35s cubic-bezier(0.34,1.56,0.64,1),
                  width 0.35s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
    }

    /* ── Page wrapper ── */
    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 44px 28px 100px;
    }
    .page-header {
      margin-bottom: 44px;
    }
    .page-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #2e2a26;
      margin: 0 0 6px;
    }
    .page-header p {
      color: #7a7068;
      font-size: 15px;
      margin: 0;
    }

    .empty-state {
      max-width: 520px;
      padding: 32px 28px;
      border-radius: 24px;
      background: rgba(255, 252, 248, 0.88);
      border: 1px solid rgba(220,210,195,0.65);
      box-shadow: 0 14px 36px rgba(120, 110, 95, 0.12);
    }
    .empty-state h2 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      color: #2e2a26;
    }
    .empty-state p {
      margin: 0;
      color: #7a7068;
      font-size: 15px;
      line-height: 1.7;
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .page-wrapper { padding: 32px 18px 80px; }
      .empty-state { padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="glass-pill" id="glassPill"></div>
      <a href="index.html" data-nav>Home</a>
      <a href="#projects" data-nav>Projects</a>
      <a href="hobbies.html" class="active" data-nav>Hobbies</a>
      <a href="travel.html" data-nav>Travel</a>
      <a href="blog.html" data-nav>Blog</a>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="page-header">
      <h1>Hobbies</h1>
      <p>A simple page for things I enjoy.</p>
    </div>
    <div class="empty-state">
      <h2>Folders removed</h2>
      <p>This section is temporarily empty. I will add new hobby content here later.</p>
    </div>
  </div>

  <script>
    /* ── Navbar pill ── */
    const pill  = document.getElementById('glassPill');
    const links = document.querySelectorAll('[data-nav]');
    const inner = document.querySelector('.navbar-inner');

    function movePill(el) {
      const iR = inner.getBoundingClientRect();
      const eR = el.getBoundingClientRect();
      pill.style.left  = (eR.left - iR.left) + 'px';
      pill.style.width = eR.width + 'px';
    }
    const activeLink = document.querySelector('[data-nav].active');
    if (activeLink) {
      requestAnimationFrame(() => {
        pill.style.transition = 'none';
        movePill(activeLink);
        requestAnimationFrame(() => { pill.style.transition = ''; });
      });
    }
    links.forEach(link => {
      link.addEventListener('mouseenter', () => movePill(link));
      link.addEventListener('click', () => {
        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
    inner.addEventListener('mouseleave', () => {
      const cur = document.querySelector('[data-nav].active');
      if (cur) movePill(cur);
    });
  </script>

</body>
</html>
